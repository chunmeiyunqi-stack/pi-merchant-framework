name: CI / CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: "20"

jobs:
  docker-build-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push main image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          tags: ghcr.io/chunmeiyunqi-stack/pi-merchant-framework:latest,ghcr.io/chunmeiyunqi-stack/pi-merchant-framework:${{ github.sha }}
      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: ghcr.io/chunmeiyunqi-stack/pi-merchant-framework-admin:latest,ghcr.io/chunmeiyunqi-stack/pi-merchant-framework-admin:${{ github.sha }}
      - name: Verify images
        run: |
          docker pull ghcr.io/chunmeiyunqi-stack/pi-merchant-framework:latest
