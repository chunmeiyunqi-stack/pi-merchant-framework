name: CI / CD
on:
  push:
    branches: [main]

jobs:
  docker-build-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/chunmeiyunqi-stack/pi-merchant-framework:latest,ghcr.io/chunmeiyunqi-stack/pi-merchant-framework:${{ github.sha }}
          secrets: |
            "NPM_CONFIG_REGISTRY=https://registry.npmjs.org"
