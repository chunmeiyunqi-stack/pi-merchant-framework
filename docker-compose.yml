# Pi Merchant Framework — Production Docker Compose
# Usage: docker compose -f docker-compose.yml up -d

services:
  # --- PostgreSQL ---
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pi_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Redis (BullMQ Queue) ---
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Database Migration ---
  migrate:
    image: node:22-bookworm-slim
    env_file: .env
    command: sh -c "corepack enable && corepack prepare pnpm@8.15.0 --activate && pnpm install -g prisma@5.22.0 && npx prisma migrate deploy --schema=/app/prisma/schema.prisma"
    volumes:
      - ./prisma:/app/prisma:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # --- Main App ---
  app:
    image: pi-merchant-framework:latest
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Admin Dashboard ---
  admin:
    image: pi-merchant-framework:admin-latest
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- BullMQ Worker ---
  worker:
    image: pi-merchant-framework:latest
    env_file: .env
    command: node apps/web/server.js
    environment:
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
      - WORKER_MODE=true
    depends_on:
      - redis
      - db
    restart: unless-stopped

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
      - admin
    restart: unless-stopped

volumes:
  pgdata: